<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Second-Brain Agent</title>
  <desc id="desc">Animated banner: notes as a small network around "Spaced repetition". One link already exists; two new connections to "Exam preparation" and "Atomic Habits" light up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .in { animation: in .9s cubic-bezier(.2,.8,.2,1) backwards; }  /* visible by default; hidden only while waiting to animate */
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.5,.5,1) backwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    .flow { stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
  </style>

  <!-- background -->
  <rect width="1280" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glow)"/>

  <!-- heading -->
  <text x="90" y="72" class="mono in" font-size="13" letter-spacing="2.5" fill="#F472B6">HARDIK’S AI LAB · PROJECT 06</text>
  <text x="87" y="138" class="in d1" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">Second-Brain Agent</text>
  <text class="in d2" font-size="21" fill="#CBD5E1">
    <tspan x="90" y="182">Search your notes by meaning, ask them questions,</tspan>
    <tspan x="90" y="210">and discover the connections you haven’t made yet.</tspan>
  </text>

  <!-- pipeline -->
  <g font-size="14" font-weight="600" fill="#E2E8F0">
    <g class="pop" style="animation-delay:1.0s">
      <rect x="90" y="242" width="70" height="32" rx="16" fill="#1E293B" stroke="#475569"/>
      <text x="125" y="263" text-anchor="middle">notes</text>
    </g>
    <g class="pop" style="animation-delay:1.15s">
      <rect x="184" y="242" width="112" height="32" rx="16" fill="#2E1065" stroke="#A78BFA"/>
      <text x="240" y="263" text-anchor="middle" fill="#DDD6FE">embeddings</text>
    </g>
    <g class="pop" style="animation-delay:1.3s">
      <rect x="320" y="242" width="98" height="32" rx="16" fill="#500724" stroke="#F472B6"/>
      <text x="369" y="263" text-anchor="middle" fill="#FBCFE8">ChromaDB</text>
    </g>
    <g class="pop" style="animation-delay:1.45s">
      <rect x="442" y="242" width="126" height="32" rx="16" fill="#172554" stroke="#60A5FA"/>
      <text x="505" y="263" text-anchor="middle" fill="#BFDBFE">plan searches</text>
    </g>
    <g class="pop" style="animation-delay:1.6s">
      <rect x="592" y="242" width="102" height="32" rx="16" fill="#14532D" stroke="#22C55E"/>
      <text x="643" y="263" text-anchor="middle" fill="#BBF7D0">connect</text>
    </g>
  </g>
  <g fill="#64748B" font-size="14" text-anchor="middle" class="in d3">
    <text x="172" y="263">›</text><text x="308" y="263">›</text><text x="430" y="263">›</text><text x="580" y="263">›</text>
  </g>

  <text x="90" y="326" class="mono in d4" font-size="12.5" letter-spacing="1.5" fill="#64748B">VECTOR DATABASE · RUNS ON YOUR MAC · OLLAMA · €0 · OBSIDIAN-FRIENDLY</text>

  <!-- the note network -->
  <g class="in d3" stroke-linecap="round">
    <line x1="980" y1="190" x2="868" y2="98" stroke="#94A3B8" stroke-width="2.5"/>
    <line x1="980" y1="190" x2="1150" y2="300" stroke="#334155" stroke-width="1.5"/>
    <line x1="868" y1="98" x2="790" y2="210" stroke="#334155" stroke-width="1.5"/>
    <line x1="1150" y1="300" x2="1178" y2="150" stroke="#334155" stroke-width="1.5"/>
  </g>
  <g stroke="#F472B6" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="980" y1="190" x2="1112" y2="88" class="flow"/>
    <line x1="980" y1="190" x2="842" y2="300" class="flow"/>
  </g>

  <g class="pop" style="animation-delay:.9s">
    <circle cx="980" cy="190" r="34" fill="#F472B6" opacity=".35" filter="url(#soft)"/>
    <circle cx="980" cy="190" r="26" fill="#831843" stroke="#F472B6" stroke-width="2.5"/>
    <text x="980" y="196" text-anchor="middle" font-size="18">🧠</text>
  </g>
  <text x="980" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#F8FAFC" class="in d3">Spaced repetition</text>

  <g font-size="12" font-weight="600" text-anchor="middle">
    <g class="pop" style="animation-delay:1.1s">
      <circle cx="868" cy="98" r="14" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
      <text x="868" y="70" fill="#CBD5E1">German vocabulary</text>
      <text x="846" y="128" class="mono" font-size="9.5" fill="#64748B" font-weight="400">linked already</text>
    </g>
    <g class="pop" style="animation-delay:1.6s">
      <circle cx="1112" cy="88" r="15" fill="#500724" stroke="#F472B6" stroke-width="2.5"/>
      <text x="1112" y="60" fill="#FBCFE8">✨ Exam preparation</text>
      <text x="1112" y="118" class="mono" font-size="9.5" fill="#F9A8D4" font-weight="400">new connection</text>
    </g>
    <g class="pop" style="animation-delay:1.9s">
      <circle cx="842" cy="300" r="15" fill="#500724" stroke="#F472B6" stroke-width="2.5"/>
      <text x="842" y="336" fill="#FBCFE8">✨ Atomic Habits</text>
      <text x="842" y="272" class="mono" font-size="9.5" fill="#F9A8D4" font-weight="400">new connection</text>
    </g>
    <g class="pop" style="animation-delay:1.3s">
      <circle cx="1150" cy="300" r="10" fill="#0F172A" stroke="#475569" stroke-width="2"/>
      <text x="1150" y="330" fill="#94A3B8">Weekly review</text>
    </g>
    <g class="pop" style="animation-delay:1.4s">
      <circle cx="790" cy="210" r="9" fill="#0F172A" stroke="#475569" stroke-width="2"/>
      <circle cx="1178" cy="150" r="9" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    </g>
  </g>
</svg>
