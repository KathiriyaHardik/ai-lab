[project]
name = "cover-letter-agent"
version = "1.0.0"
description = "An AI agent that plans, writes, checks and fixes cover letters and recruiter messages, and waits for your approval at every step. Runs locally with Ollama."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-docx>=1.1",  # the Word file you download at the end
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
