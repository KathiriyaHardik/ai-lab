<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Company Research Agent</title>
  <desc id="desc">Animated banner: a team of six agent cards (Scout, Researcher, Fact-checker, Strategist, Writer, and you) passes work along to produce a personal message you approve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .in { animation: in .9s cubic-bezier(.2,.8,.2,1) backwards; }  /* visible by default; hidden only while waiting to animate */
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.5,.5,1) backwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
    .flow { stroke-dasharray: 5 6; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    .card text.t { font-size: 14px; font-weight: 700; }
    .card text.s { font-size: 11.5px; }
  </style>

  <!-- background -->
  <rect width="1280" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glow)"/>

  <!-- heading -->
  <text x="90" y="72" class="mono in" font-size="13" letter-spacing="2.5" fill="#22D3EE">HARDIK’S AI LAB · PROJECT 07</text>
  <text x="87" y="136" class="in d1" font-size="49" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">Company Research Agent</text>
  <text class="in d2" font-size="21" fill="#CBD5E1">
    <tspan x="90" y="182">A team of AI agents reads a company’s website, checks</tspan>
    <tspan x="90" y="210">every fact and drafts a personal message you approve.</tspan>
  </text>
  <g class="in d3" font-size="15" fill="#94A3B8">
    <text x="90" y="256">✓ only the company’s own public pages, and robots.txt is respected</text>
    <text x="90" y="282">✓ every fact quoted from its page, and a second agent double-checks it</text>
  </g>
  <text x="90" y="330" class="mono in d4" font-size="12.5" letter-spacing="1.5" fill="#64748B">MULTI-AGENT · OLLAMA · €0 · LINKEDIN OR EMAIL · NOTHING IS SENT</text>

  <!-- the team -->
  <g fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M960 92 H 988" class="flow"/>
    <path d="M1100 116 V 140" class="flow"/>
    <path d="M988 172 H 960" class="flow"/>
    <path d="M846 196 V 220" class="flow"/>
    <path d="M960 252 H 988" class="flow"/>
  </g>
  <g class="card">
    <g class="pop" style="animation-delay:.9s">
      <rect x="732" y="66" width="228" height="52" rx="12" fill="#0F172A" stroke="#334155"/>
      <text class="t" x="748" y="88" fill="#E2E8F0">🕵️ Scout</text>
      <text class="s" x="748" y="106" fill="#94A3B8">reads up to 8 pages, politely</text>
    </g>
    <g class="pop" style="animation-delay:1.1s">
      <rect x="992" y="66" width="228" height="52" rx="12" fill="#2E1065" stroke="#A78BFA"/>
      <text class="t" x="1008" y="88" fill="#DDD6FE">🔬 Researcher</text>
      <text class="s" x="1008" y="106" fill="#C4B5FD">facts, each with a quote</text>
    </g>
    <g class="pop" style="animation-delay:1.3s">
      <rect x="992" y="146" width="228" height="52" rx="12" fill="#450A0A" stroke="#F87171"/>
      <text class="t" x="1008" y="168" fill="#FECACA">⚖️ Fact-checker</text>
      <text class="s" x="1008" y="186" fill="#FCA5A5">caught 6 of 6 planted errors</text>
    </g>
    <g class="pop" style="animation-delay:1.5s">
      <rect x="732" y="146" width="228" height="52" rx="12" fill="#14532D" stroke="#22C55E"/>
      <text class="t" x="748" y="168" fill="#BBF7D0">✋ You: tick the facts</text>
      <text class="s" x="748" y="186" fill="#86EFAC">only these are used</text>
    </g>
    <g class="pop" style="animation-delay:1.7s">
      <rect x="732" y="226" width="228" height="52" rx="12" fill="#172554" stroke="#60A5FA"/>
      <text class="t" x="748" y="248" fill="#BFDBFE">🎯 Strategist</text>
      <text class="s" x="748" y="266" fill="#93C5FD">company fact ↔ your experience</text>
    </g>
    <g class="pop" style="animation-delay:1.9s">
      <rect x="992" y="226" width="228" height="52" rx="12" fill="#451A03" stroke="#F59E0B"/>
      <text class="t" x="1008" y="248" fill="#FDE68A">✍️ Writer → ✋ You</text>
      <text class="s" x="1008" y="266" fill="#FCD34D">checked by Python · you approve</text>
    </g>
  </g>
  <text x="976" y="312" text-anchor="middle" class="mono in d4" font-size="11" letter-spacing="1" fill="#64748B">one local model, six roles</text>
</svg>
