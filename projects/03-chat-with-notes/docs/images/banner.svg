<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Chat with Your Notes</title>
  <desc id="desc">Animated banner: a question about a lecture is answered from a stack of PDF pages, with the source file and page shown and the quote checked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .in { animation: in .9s cubic-bezier(.2,.8,.2,1) backwards; }  /* visible by default; hidden only while waiting to animate */
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.5,.5,1) backwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    .flow { stroke-dasharray: 7 8; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -30; } }
  </style>

  <!-- background -->
  <rect width="1280" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glow)"/>

  <!-- heading -->
  <text x="90" y="72" class="mono in" font-size="13" letter-spacing="2.5" fill="#A78BFA">NOVAWERK LAB · PROJECT 03</text>
  <text x="87" y="138" class="in d1" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">Chat with Your Notes</text>
  <text class="in d2" font-size="21" fill="#CBD5E1">
    <tspan x="90" y="182">Ask your lecture PDFs a question. Get the answer with</tspan>
    <tspan x="90" y="210">the file and page it comes from, and a checked quote.</tspan>
  </text>

  <!-- RAG pipeline -->
  <g font-size="14" font-weight="600" fill="#E2E8F0">
    <g class="pop" style="animation-delay:1.1s">
      <rect x="90" y="242" width="68" height="32" rx="16" fill="#1E293B" stroke="#475569"/>
      <text x="124" y="263" text-anchor="middle">PDFs</text>
    </g>
    <g class="pop" style="animation-delay:1.25s">
      <rect x="182" y="242" width="80" height="32" rx="16" fill="#1E293B" stroke="#475569"/>
      <text x="222" y="263" text-anchor="middle">pages</text>
    </g>
    <g class="pop" style="animation-delay:1.4s">
      <rect x="286" y="242" width="118" height="32" rx="16" fill="#2E1065" stroke="#A78BFA"/>
      <text x="345" y="263" text-anchor="middle" fill="#DDD6FE">embeddings</text>
    </g>
    <g class="pop" style="animation-delay:1.55s">
      <rect x="428" y="242" width="84" height="32" rx="16" fill="#172554" stroke="#60A5FA"/>
      <text x="470" y="263" text-anchor="middle" fill="#BFDBFE">search</text>
    </g>
    <g class="pop" style="animation-delay:1.7s">
      <rect x="536" y="242" width="150" height="32" rx="16" fill="#14532D" stroke="#22C55E"/>
      <text x="611" y="263" text-anchor="middle" fill="#BBF7D0">answer + proof</text>
    </g>
  </g>
  <g fill="#64748B" font-size="14" text-anchor="middle" class="in d3">
    <text x="170" y="263">›</text><text x="274" y="263">›</text><text x="416" y="263">›</text><text x="524" y="263">›</text>
  </g>

  <text x="90" y="326" class="mono in d4" font-size="12.5" letter-spacing="1.5" fill="#64748B">RAG · RUNS 100% ON YOUR MAC · OLLAMA · €0 · ENGLISH + DEUTSCH</text>

  <!-- stack of pages -->
  <g class="in d3">
    <rect x="744" y="118" width="132" height="172" rx="10" fill="#0F172A" stroke="#334155"/>
    <rect x="752" y="110" width="132" height="172" rx="10" fill="#0F172A" stroke="#334155"/>
    <rect x="760" y="102" width="132" height="172" rx="10" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <text x="774" y="126" class="mono" font-size="10.5" letter-spacing="1.5" fill="#A78BFA">PAGE 10</text>
    <g fill="#334155">
      <rect x="774" y="140" width="96" height="6" rx="3"/>
      <rect x="774" y="154" width="84" height="6" rx="3"/>
      <rect x="770" y="174" width="112" height="16" rx="4" fill="#FDE68A" fill-opacity=".22"/>
      <rect x="774" y="179" width="100" height="6" rx="3" fill="#FDE68A"/>
      <rect x="774" y="202" width="90" height="6" rx="3"/>
      <rect x="774" y="216" width="104" height="6" rx="3"/>
      <rect x="774" y="230" width="70" height="6" rx="3"/>
      <rect x="774" y="250" width="88" height="6" rx="3"/>
    </g>
  </g>
  <path d="M884 182 C 900 182, 902 168, 922 168" fill="none" stroke="#FDE68A" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" class="flow"/>

  <!-- chat -->
  <g class="pop" style="animation-delay:.9s">
    <rect x="958" y="58" width="262" height="44" rx="14" fill="#2563EB"/>
    <text x="976" y="86" font-size="16" font-weight="600" fill="#FFFFFF">When is the DS-204 exam?</text>
  </g>
  <g class="pop" style="animation-delay:1.5s">
    <rect x="924" y="122" width="296" height="92" rx="14" fill="#0F172A" stroke="#334155"/>
    <text font-size="15.5" fill="#E2E8F0">
      <tspan x="942" y="152">On 12 February 2027. It lasts</tspan>
      <tspan x="942" y="174">90 minutes, and you may bring</tspan>
      <tspan x="942" y="196">one handwritten A4 sheet.</tspan>
    </text>
  </g>
  <g class="pop" style="animation-delay:2s">
    <rect x="924" y="228" width="296" height="34" rx="17" fill="#14532D" stroke="#22C55E"/>
    <text x="1072" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#BBF7D0">✓ ml_lecture.pdf · page 10</text>
  </g>
  <text x="1072" y="296" text-anchor="middle" class="mono in d4" font-size="11" letter-spacing="1" fill="#64748B">every quote checked against the page</text>
</svg>
