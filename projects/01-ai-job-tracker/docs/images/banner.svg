<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">AI Job Application CRM</title>
  <desc id="desc">Animated banner: an application moves through the pipeline from Wishlist to Offer while a mini dashboard fills in.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .in { animation: in .9s cubic-bezier(.2,.8,.2,1) backwards; }  /* visible by default; hidden only while waiting to animate */
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* pipeline: a dot travels left to right, each stage lights up as it passes, then everything resets */
    .run { animation-duration: 7.2s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .l0 { animation-name: l0; } .l1 { animation-name: l1; } .l2 { animation-name: l2; }
    .l3 { animation-name: l3; } .l4 { animation-name: l4; } .l5 { animation-name: l5; }
    @keyframes l0 { 0% { opacity: 0 } 2%, 85% { opacity: 1 } 92%, 100% { opacity: 0 } }
    @keyframes l1 { 0%, 12% { opacity: 0 } 14%, 85% { opacity: 1 } 92%, 100% { opacity: 0 } }
    @keyframes l2 { 0%, 24% { opacity: 0 } 26%, 85% { opacity: 1 } 92%, 100% { opacity: 0 } }
    @keyframes l3 { 0%, 36% { opacity: 0 } 38%, 85% { opacity: 1 } 92%, 100% { opacity: 0 } }
    @keyframes l4 { 0%, 48% { opacity: 0 } 50%, 85% { opacity: 1 } 92%, 100% { opacity: 0 } }
    @keyframes l5 { 0%, 60% { opacity: 0 } 62%, 85% { opacity: 1 } 92%, 100% { opacity: 0 } }
    .dot { animation-name: travel; }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 1; }
      60%, 85% { transform: translateX(680px); opacity: 1; }
      92%, 100% { transform: translateX(680px); opacity: 0; }
    }
    .progress { stroke-dasharray: 680; animation-name: progress; }
    @keyframes progress {
      0% { stroke-dashoffset: 680; opacity: 1; }
      60%, 85% { stroke-dashoffset: 0; opacity: 1; }
      92%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* mini dashboard */
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1.3s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  </style>

  <!-- background -->
  <rect width="1280" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glow)"/>

  <!-- heading -->
  <text x="64" y="80" class="mono in" font-size="13" letter-spacing="2.5" fill="#60A5FA">HARDIK’S AI LAB · PROJECT 01 · EXCEL + GOOGLE SHEETS</text>
  <text x="62" y="140" class="in d1" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1">AI Job Application CRM</text>
  <text x="64" y="182" class="in d2" font-size="20" fill="#CBD5E1">A job-search CRM for AI Engineer · Generative AI · Agentic AI roles</text>
  <text x="64" y="210" class="in d3" font-size="17" fill="#94A3B8">Follow-ups, pipeline, analytics and a live dashboard — Stuttgart, Germany &amp; remote</text>

  <!-- pipeline: track -->
  <g class="in d4">
    <line x1="122" y1="279" x2="802" y2="279" stroke="#334155" stroke-width="2"/>
    <line x1="122" y1="279" x2="802" y2="279" stroke="#60A5FA" stroke-width="2.5" class="progress run"/>

    <!-- idle pills -->
    <g fill="#0F172A" stroke="#334155" stroke-width="1.5">
      <rect x="64" y="262" width="116" height="34" rx="17"/>
      <rect x="200" y="262" width="116" height="34" rx="17"/>
      <rect x="336" y="262" width="116" height="34" rx="17"/>
      <rect x="472" y="262" width="116" height="34" rx="17"/>
      <rect x="608" y="262" width="116" height="34" rx="17"/>
      <rect x="744" y="262" width="116" height="34" rx="17"/>
    </g>
    <g font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">
      <text x="122" y="284">Wishlist</text>
      <text x="258" y="284">Applied</text>
      <text x="394" y="284">Screening</text>
      <text x="530" y="284">Interview</text>
      <text x="666" y="284">Final</text>
      <text x="802" y="284">Offer</text>
    </g>

    <!-- lit pills (status colours from the workbook) -->
    <g font-size="14" font-weight="700" text-anchor="middle">
      <g class="run l0"><rect x="64" y="262" width="116" height="34" rx="17" fill="#94A3B8"/><text x="122" y="284" fill="#0F172A">Wishlist</text></g>
      <g class="run l1"><rect x="200" y="262" width="116" height="34" rx="17" fill="#3B82F6"/><text x="258" y="284" fill="#FFFFFF">Applied</text></g>
      <g class="run l2"><rect x="336" y="262" width="116" height="34" rx="17" fill="#F59E0B"/><text x="394" y="284" fill="#422006">Screening</text></g>
      <g class="run l3"><rect x="472" y="262" width="116" height="34" rx="17" fill="#F97316"/><text x="530" y="284" fill="#FFFFFF">Interview</text></g>
      <g class="run l4"><rect x="608" y="262" width="116" height="34" rx="17" fill="#8B5CF6"/><text x="666" y="284" fill="#FFFFFF">Final</text></g>
      <g class="run l5">
        <rect x="738" y="256" width="128" height="46" rx="23" fill="#22C55E" opacity=".45" filter="url(#soft)"/>
        <rect x="744" y="262" width="116" height="34" rx="17" fill="#22C55E"/><text x="802" y="284" fill="#052E16">Offer ✓</text>
      </g>
    </g>

    <!-- travelling application -->
    <g class="dot run">
      <circle cx="122" cy="244" r="11" fill="#60A5FA" opacity=".55" filter="url(#soft)"/>
      <circle cx="122" cy="244" r="5.5" fill="#F8FAFC"/>
      <path d="M116 252 L122 258 L128 252" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="64" y="334" class="mono" font-size="12" letter-spacing="1" fill="#64748B">status pipeline  →  follow-ups  →  analytics  →  dashboard</text>
  </g>

  <!-- mini dashboard card -->
  <g class="in d3">
    <rect x="900" y="44" width="320" height="292" rx="16" fill="#0F172A" fill-opacity=".88" stroke="#334155"/>
    <text x="924" y="76" class="mono" font-size="11" letter-spacing="2" fill="#94A3B8">JOB SEARCH DASHBOARD</text>
    <circle cx="1196" cy="72" r="4" fill="#22C55E" class="blink"/>

    <g font-weight="800" font-size="30" fill="#F8FAFC">
      <text x="924" y="120">13</text>
      <text x="1024" y="120">6</text>
      <text x="1112" y="120">46%</text>
    </g>
    <g font-size="11" fill="#94A3B8">
      <text x="924" y="138">applications</text>
      <text x="1024" y="138">interviews</text>
      <text x="1112" y="138">→ interview</text>
    </g>

    <g fill="#2563EB">
      <rect class="bar" style="animation-delay:.60s" x="924" y="218" width="16" height="14" rx="3"/>
      <rect class="bar" style="animation-delay:.66s" x="947" y="210" width="16" height="22" rx="3"/>
      <rect class="bar" style="animation-delay:.72s" x="970" y="214" width="16" height="18" rx="3"/>
      <rect class="bar" style="animation-delay:.78s" x="993" y="202" width="16" height="30" rx="3"/>
      <rect class="bar" style="animation-delay:.84s" x="1016" y="206" width="16" height="26" rx="3"/>
      <rect class="bar" style="animation-delay:.90s" x="1039" y="198" width="16" height="34" rx="3"/>
      <rect class="bar" style="animation-delay:.96s" x="1062" y="190" width="16" height="42" rx="3"/>
      <rect class="bar" style="animation-delay:1.02s" x="1085" y="194" width="16" height="38" rx="3"/>
      <rect class="bar" style="animation-delay:1.08s" x="1108" y="182" width="16" height="50" rx="3"/>
      <rect class="bar" style="animation-delay:1.14s" x="1131" y="186" width="16" height="46" rx="3"/>
      <rect class="bar" style="animation-delay:1.20s" x="1154" y="174" width="16" height="58" rx="3"/>
      <rect class="bar" style="animation-delay:1.26s" x="1177" y="166" width="16" height="66" rx="3" fill="#60A5FA"/>
    </g>
    <line x1="924" y1="232.5" x2="1196" y2="232.5" stroke="#334155"/>
    <text x="924" y="250" class="mono" font-size="10" fill="#64748B">applications / week · last 12 weeks</text>

    <g class="blink">
      <rect x="924" y="268" width="156" height="24" rx="12" fill="#7F1D1D"/>
      <text x="1002" y="284" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FECACA" letter-spacing=".5">FOLLOW UP REQUIRED</text>
    </g>
    <rect x="1088" y="268" width="96" height="24" rx="12" fill="#713F12"/>
    <text x="1136" y="284" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FEF08A" letter-spacing=".5">DUE SOON</text>
    <text x="924" y="316" class="mono" font-size="10" fill="#64748B">2 overdue · 1 due today · 2 interviews ahead</text>
  </g>
</svg>
