<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Hardik’s AI Lab</title>
  <desc id="desc">Practical AI agents for real work, built in public and explained simply. Roadmap of 8 projects: 01 Job Tracker and 02 Job-Fit Checker are live, 03 Chat with Your Notes is next, 04 to 08 are coming soon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#172036"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.6" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .in { animation: in .9s cubic-bezier(.2,.8,.2,1) backwards; }  /* visible by default; hidden only while waiting to animate */
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.3,1.5,.5,1) backwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
    .flow { stroke-dasharray: 8 9; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -34; } }
    .caret { animation: caret 1.1s steps(1) infinite; }
    @keyframes caret { 50% { opacity: 0; } }
  </style>

  <!-- background -->
  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="18" fill="url(#glowL)"/>
  <rect width="1280" height="400" rx="18" fill="url(#glowR)"/>

  <!-- heading -->
  <text x="90" y="74" class="mono in" font-size="13" letter-spacing="2.5" fill="#A78BFA">AI ENGINEERING · AGENTS · RAG · AUTOMATION — BUILT IN PUBLIC FROM GERMANY</text>
  <text x="87" y="142" class="in" style="animation-delay:.15s" font-size="66" font-weight="800" letter-spacing="-1.5" fill="url(#title-grad)">Hardik’s AI Lab<tspan class="caret" fill="#60A5FA" font-weight="400">_</tspan></text>
  <text x="90" y="184" class="in" style="animation-delay:.35s" font-size="22" fill="#CBD5E1">Practical AI agents for real work — built in public, explained simply.</text>

  <!-- roadmap track -->
  <g class="in" style="animation-delay:.5s">
    <line x1="90" y1="276" x2="1190" y2="276" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="276" x2="247" y2="276" stroke="#22C55E" stroke-width="3"/>
    <line x1="247" y1="276" x2="404" y2="276" stroke="#60A5FA" stroke-width="3" class="flow"/>
    <text x="90" y="232" class="mono" font-size="12" letter-spacing="2" fill="#64748B">ROADMAP</text>
    <text x="1190" y="232" class="mono" font-size="12" letter-spacing="1" fill="#64748B" text-anchor="end">2 of 8 shipped</text>
  </g>

  <!-- 01–02: live -->
  <g class="pop" style="animation-delay:.7s">
    <circle cx="90" cy="276" r="22" fill="#22C55E" opacity=".45" filter="url(#soft)"/>
    <circle cx="90" cy="276" r="16" fill="#22C55E"/>
    <path d="M83 276 L88 281 L97 271" fill="none" stroke="#052E16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="pop" style="animation-delay:.8s">
    <circle cx="247" cy="276" r="22" fill="#22C55E" opacity=".45" filter="url(#soft)"/>
    <circle cx="247" cy="276" r="16" fill="#22C55E"/>
    <path d="M240 276 L245 281 L254 271" fill="none" stroke="#052E16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 03: next up (pulsing) -->
  <g class="pop" style="animation-delay:.9s">
    <circle cx="404" cy="276" r="15" fill="none" stroke="#60A5FA" stroke-width="2.5" class="ping"/>
    <circle cx="404" cy="276" r="15" fill="#0F172A" stroke="#60A5FA" stroke-width="3"/>
    <circle cx="404" cy="276" r="5" fill="#60A5FA"/>
  </g>
  <!-- 04–08: coming soon -->
  <g fill="#0F172A" stroke="#475569" stroke-width="2.5">
    <circle class="pop" style="animation-delay:1.0s" cx="561" cy="276" r="13"/>
    <circle class="pop" style="animation-delay:1.1s" cx="718" cy="276" r="13"/>
    <circle class="pop" style="animation-delay:1.2s" cx="875" cy="276" r="13"/>
    <circle class="pop" style="animation-delay:1.3s" cx="1032" cy="276" r="13"/>
    <circle class="pop" style="animation-delay:1.4s" cx="1189" cy="276" r="13"/>
  </g>

  <!-- labels -->
  <g class="in" style="animation-delay:.9s" text-anchor="middle">
    <g class="mono" font-size="12" fill="#64748B">
      <text x="90" y="252" fill="#4ADE80">01</text>
      <text x="247" y="252" fill="#4ADE80">02</text>
      <text x="404" y="252" fill="#60A5FA">03</text>
      <text x="561" y="252">04</text>
      <text x="718" y="252">05</text>
      <text x="875" y="252">06</text>
      <text x="1032" y="252">07</text>
      <text x="1189" y="252">08</text>
    </g>
    <g font-size="14" font-weight="600" fill="#94A3B8">
      <text x="90" y="318" fill="#F8FAFC">Job Tracker</text>
      <text x="247" y="318" fill="#F8FAFC">Job-Fit Checker</text>
      <text x="404" y="318" fill="#F8FAFC">Chat with Notes</text>
      <text x="561" y="318">Letter Explainer</text>
      <text x="718" y="318">Cover Letter Agent</text>
      <text x="875" y="318">Second Brain</text>
      <text x="1032" y="318">Research Agent</text>
      <text x="1189" y="318">First Product</text>
    </g>
    <g class="mono" font-size="11" letter-spacing="1">
      <text x="90" y="340" fill="#4ADE80">LIVE</text>
      <text x="247" y="340" fill="#4ADE80">LIVE</text>
      <text x="404" y="340" fill="#60A5FA">NEXT UP</text>
      <g fill="#475569">
        <text x="561" y="340">SOON</text>
        <text x="718" y="340">SOON</text>
        <text x="875" y="340">SOON</text>
        <text x="1032" y="340">SOON</text>
        <text x="1189" y="340">SOON</text>
      </g>
    </g>
  </g>
</svg>
